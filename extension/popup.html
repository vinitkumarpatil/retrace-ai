<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReTrace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #c8d6e5;
    }
    .header {
      background: linear-gradient(135deg, #1a1f36 0%, #0d1117 100%);
      padding: 16px;
      border-bottom: 1px solid #1e2d3d;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #5ba3f5;
      margin-bottom: 4px;
    }
    .header .subtitle {
      font-size: 11px;
      color: #6b7b8d;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #0d1117;
      border-bottom: 1px solid #1e2d3d;
      font-size: 11px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.disconnected { background: #ef4444; }
    .page-info {
      padding: 16px;
      border-bottom: 1px solid #1e2d3d;
    }
    .page-title {
      font-size: 14px;
      font-weight: 500;
      color: #e2e8f0;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .page-url {
      font-size: 11px;
      color: #6b7b8d;
      word-break: break-all;
    }
    .page-domain {
      font-size: 11px;
      color: #5ba3f5;
      margin-top: 4px;
    }
    .content-preview {
      padding: 12px 16px;
      border-bottom: 1px solid #1e2d3d;
      max-height: 120px;
      overflow-y: auto;
    }
    .content-preview p {
      font-size: 12px;
      color: #8899aa;
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .project-select {
      padding: 12px 16px;
      border-bottom: 1px solid #1e2d3d;
    }
    .project-select label {
      font-size: 11px;
      color: #6b7b8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }
    .project-select select {
      width: 100%;
      padding: 8px 10px;
      background: #1a1f36;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #c8d6e5;
      font-size: 13px;
      outline: none;
    }
    .project-select select:focus {
      border-color: #5ba3f5;
    }
    .actions {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #1e2d3d;
      color: #c8d6e5;
      border: 1px solid #2d3748;
    }
    .btn-secondary:hover { background: #2d3748; }
    .btn-ghost {
      background: transparent;
      color: #6b7b8d;
    }
    .btn-ghost:hover { color: #c8d6e5; }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row .btn { flex: 1; }
    .footer {
      padding: 10px 16px;
      background: #0d1117;
      border-top: 1px solid #1e2d3d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer a {
      font-size: 11px;
      color: #5ba3f5;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
    .footer .version {
      font-size: 10px;
      color: #4a5568;
    }
    .toast {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #065f46; color: #6ee7b7; }
    .toast.error { background: #7f1d1d; color: #fca5a5; }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ReTrace</h1>
    <div class="subtitle">Context Capture</div>
  </div>

  <div class="status-bar">
    <div id="status-text">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-label">Checking...</span>
    </div>
    <span id="status-mode" style="color: #6b7b8d;"></span>
  </div>

  <div class="page-info">
    <div class="page-title" id="page-title">Loading...</div>
    <div class="page-url" id="page-url"></div>
    <div class="page-domain" id="page-domain"></div>
  </div>

  <div class="content-preview" id="content-preview">
    <p>Loading page content...</p>
  </div>

  <div class="project-select">
    <label>Project</label>
    <select id="project-select">
      <option value="Phoenix">Project Phoenix</option>
      <option value="default">General</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-save" disabled>
      Save Context
    </button>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-save-ask" disabled>
        Save + Ask
      </button>
      <button class="btn btn-ghost" id="btn-cancel">
        Cancel
      </button>
    </div>
  </div>

  <div class="footer">
    <a href="http://localhost:3000" target="_blank">Open ReTrace Dashboard</a>
    <span class="version">v1.0.0</span>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
